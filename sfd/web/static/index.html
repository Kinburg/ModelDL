<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelDL</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <img class="logo" src="/static/logo.png" alt="" width="22" height="22">
    <h1>ModelDL</h1>
  </div>
  <div class="link-box">
    <input id="source" aria-label="Link to download" spellcheck="false" autocomplete="off"
           placeholder="Paste a HuggingFace or Civitai link, or org/repo" autofocus>
    <button class="primary" id="add">Add</button>
  </div>
  <label class="search-box" data-icon="search">
    <input id="search" type="search" aria-label="Search" spellcheck="false" autocomplete="off"
           placeholder="Search the library">
  </label>
  <button id="open-settings" class="icon-button big" data-icon="settings" title="Settings" aria-label="Settings"></button>
</header>

<main id="panes">
  <nav id="sidebar" aria-label="Views and folders"></nav>
  <div class="splitter" data-side="left" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
  <section id="center" aria-label="List"></section>
  <div class="splitter" data-side="right" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
  <aside id="inspector" aria-label="Details"></aside>
</main>

<footer id="status"></footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
