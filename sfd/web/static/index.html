<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelDL</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1>ModelDL</h1>
  <input id="source" placeholder="Paste a HuggingFace or Civitai link, or org/repo" autofocus>
  <button class="primary" id="add">Add</button>
  <button id="toggle-settings">Settings</button>
</header>

<main>
  <div id="message" class="small" style="margin-bottom:12px"></div>

  <div class="row" style="margin-bottom:12px">
    <span class="small muted" id="summary"></span>
    <span class="small muted" id="totals" hidden></span>
    <span class="small warn" id="space" hidden></span>
    <span style="flex:1"></span>
    <input id="filter-text" class="filter" placeholder="Filter by name" spellcheck="false">
    <select id="filter-state" class="filter">
      <option value="all">everything</option>
      <option value="active">active</option>
      <option value="blocked">needs a decision</option>
      <option value="failed">failed</option>
      <option value="done">finished</option>
    </select>
    <!-- Windows Task Manager reports bits, downloaders report bytes, and the factor of 8
         between them makes every cross-check look like a bug. -->
    <button id="start-all" hidden class="primary">Start all</button>
    <button id="toggle-units" title="Switch speed between bytes and bits">MB/s</button>
    <button id="clear-done">Clear finished</button>
  </div>

  <div id="tasks"></div>
  <div class="empty" id="empty">Nothing queued yet.</div>
</main>

<!-- Settings modal -->
<div class="modal-backdrop" id="settings-backdrop">
  <div class="modal" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-header">
      <strong id="settings-title">Settings</strong>
      <button class="modal-close" id="close-settings" title="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="grid">
        <label for="library_root">Library root</label>
        <div class="input-with-btn">
          <input id="library_root" placeholder="F:\ComfyUI\Shared — leave empty to keep one flat folder">
          <button type="button" class="btn-browse" data-target="library_root" title="Choose folder in File Explorer">Browse…</button>
        </div>

        <label for="profile">Folder profile</label>
        <select id="profile"><option value="comfyui">ComfyUI</option><option value="a1111">A1111</option></select>

        <label for="group_by_base_model">Group by base model</label>
        <input type="checkbox" id="group_by_base_model">

        <label for="hf_token">HuggingFace token</label>
        <input id="hf_token" type="password" placeholder="unchanged">

        <label for="civitai_token">Civitai API key</label>
        <input id="civitai_token" type="password" placeholder="unchanged">

        <label for="connections">Connections per file</label>
        <input id="connections" type="number" min="1" max="64">

        <label for="concurrent_downloads">Files at once</label>
        <input id="concurrent_downloads" type="number" min="1" max="8">

        <label for="auto_start" title="Off: added links wait paused until you press Start all">Start downloads on add</label>
        <input type="checkbox" id="auto_start">

        <label for="max_speed_kb" title="Shared by every connection of every file. 0 leaves the link alone. Takes effect immediately, mid-download. The huggingface_hub engine downloads in its own subprocess and is not capped">Speed limit, KB/s</label>
        <input id="max_speed_kb" type="number" min="0" step="64" placeholder="0 = unlimited">

        <label for="auto_retry" title="A failed download is picked back up after 30s, 2min and 10min. Failures a wait cannot fix — a missing token, a full disk — are never retried">Retry failures on their own</label>
        <input type="checkbox" id="auto_retry">

        <label for="queue_position" title="Where newly added downloads appear in the list">Add new downloads to</label>
        <select id="queue_position">
          <option value="bottom">bottom of the list</option>
          <option value="top">top of the list</option>
        </select>

        <label for="hf_engine" title="native: our transfer, with resume and hashing we control. hf_hub: HuggingFace's own client in a subprocess, for Xet chunk deduplication">HuggingFace engine</label>
        <select id="hf_engine">
          <option value="native">native transfer</option>
          <option value="hf_hub">huggingface_hub (subprocess)</option>
        </select>

        <label for="hf_fallback" title="Try the other engine once when one fails outright">Fall back to the other engine</label>
        <input type="checkbox" id="hf_fallback">

        <label for="disk_kind">Target disk</label>
        <select id="disk_kind">
          <option value="">detect automatically</option>
          <option value="ssd">SSD / NVMe</option>
          <option value="hdd">mechanical</option>
        </select>

        <label for="verify_hash">Verify checksums</label>
        <input type="checkbox" id="verify_hash">

        <label for="write_sidecars">Write metadata sidecars</label>
        <input type="checkbox" id="write_sidecars">

        <label for="sidecar_dir">Keep .json records in</label>
        <div class="input-with-btn">
          <input id="sidecar_dir" placeholder="empty = next to each model; a path collects them">
          <button type="button" class="btn-browse" data-target="sidecar_dir" title="Choose folder in File Explorer">Browse…</button>
        </div>

        <label for="write_compat_files" title="Read by A1111 and ComfyUI model managers, which look for them beside the model">Also .civitai.info + preview</label>
        <input type="checkbox" id="write_compat_files">

        <label for="write_trigger_txt" title="Loaders paste this file straight into the prompt, so it holds the trigger words and nothing else">Trigger words as .txt</label>
        <input type="checkbox" id="write_trigger_txt">
      </div>
      <pre id="layout" class="small muted" style="white-space:pre-wrap"></pre>
    </div>
    <div class="modal-footer">
      <button class="primary" id="save-settings">Save</button>
      <button id="show-layout">Check folder mapping</button>
      <span style="flex:1"></span>
      <span class="small muted" id="settings-saved"></span>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
