[project]
name = "model-dl"
version = "0.1.0"
description = "Downloader for large model files from HuggingFace and Civitai, built around expiring signed URLs"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
