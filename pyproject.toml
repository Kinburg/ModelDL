[project]
name = "model-dl"
# Read from sfd/__init__.py, the one place the version is written down: the program reports
# it, and a release tag has to match it.
dynamic = ["version"]
description = "Downloader for large model files from HuggingFace and Civitai, built around expiring signed URLs"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.34"]
# The standalone window. Without it the same server still runs and opens in a browser, so
# this is not something a command-line or headless install should have to carry.
desktop = ["pywebview>=5.0"]
build = ["pyinstaller>=6.0", "pywebview>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sfd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sfd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
